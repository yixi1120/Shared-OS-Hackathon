[project]
name = "sharedos-commerce-agent"
version = "0.1.0"
description = "Autonomous commerce and Arena-compliance agent for the SharedOS Hackathon"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
arena-harness = "sharedos_commerce_agent.harness:main"
commerce-api = "sharedos_commerce_agent.api:run"
seller-harness = "sharedos_commerce_agent.seller_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharedos_commerce_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
